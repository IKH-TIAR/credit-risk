services:
  credit-risk-api:
    build:
      context: .
    environment:
      CREDIT_RISK_MODEL_URI: file:///app/model
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns/1/models/m-4c5abd8e8d0140429187267b2edde08d/artifacts:/app/model:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
